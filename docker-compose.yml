services:
  nms:
    image: illuspas/node-media-server:2.7.5
    ports:
      - "1935:1935"
      - "8000:8000"
      - "8443:8443"

  ngrok:
    image: ngrok/ngrok:latest
    command: tcp nms:1935
    env_file: .env
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - nms

  ws:
    build: ./services/ws
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1

  gemini:
    build: ./services/translator
    ports:
      - "8002:8000"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - WS_PUBLISH_URL=http://ws:8000/publish
      - ZOOM_CAPTION_URL=${ZOOM_CAPTION_URL:-}
      - ZOOM_CAPTION_LANG=${ZOOM_CAPTION_LANG:-}
      # Default is a fast model for lower latency; override in .env for quality.
      # Example: GEMINI_MODEL=gemini-3.1-pro-preview
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      # -----------------------------------------------------------------
      # NEW 2026-02-04: Parallel queue settings to prevent lag accumulation
      # -----------------------------------------------------------------
      # Number of parallel translation workers
      # With 6 workers @ ~4s TTFT: 6 * 15/min = 90 translations/min capacity
      # This exceeds typical speech rate (~40/min) preventing queue buildup
      - TRANSLATION_WORKERS=${TRANSLATION_WORKERS:-6}
      # Maximum queue size before dropping (prevents memory issues)
      - TRANSLATION_QUEUE_SIZE=${TRANSLATION_QUEUE_SIZE:-50}
      # Lag threshold - requests older than this may be dropped/summarized
      - LAG_THRESHOLD_SECONDS=${LAG_THRESHOLD_SECONDS:-3.0}
      # Enable batch summarization for lag recovery
      - ENABLE_SUMMARIZATION=${ENABLE_SUMMARIZATION:-true}
    depends_on:
      - ws

  deepgram:
    build: ./services/asr
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DEEPGRAM_VAD_EVENTS=${DEEPGRAM_VAD_EVENTS:-true}
      - RTMP_URL=rtmp://nms:1935/live/zoom
      - WS_PUBLISH_URL=http://ws:8000/publish
      - TRANSLATION_API_URL=http://gemini:8000/translate
      - DICTIONARY_PATH=/app/dictionary.csv
    volumes:
      - ./dictionary.csv:/app/dictionary.csv:ro
    depends_on:
      - nms
      - gemini
      - ws

  ws-debug:
    image: python:3.12-slim
    profiles:
      - debug
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./scripts:/scripts
    command: sh -c "pip install -q websockets && python /scripts/ws_debug.py"
    depends_on:
      - ws
