[project]
name = "real-time-translation"
version = "0.1.0"
description = "Real-time translation application for Zoom meetings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepgram-sdk>=5.0.0,<6.0.0",
    "google-genai>=1.58.0",
    "gradio>=6.3.0",
    "langchain>=1.2.6",
    "langchain-google-genai>=4.2.0",
    "langchain-openai>=0.2.0",
    "python-dotenv>=1.0.0",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
rtms = { index = "testpypi" }

[project.optional-dependencies]
zoom = ["rtms>=0.0.2"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]
experiments = ["sacrebleu>=2.4.0", "yt-dlp>=2024.1.0"]
preload = [
    "pypdf>=5.0.0",
    "python-pptx>=1.0.0",
]

[project.scripts]
real-time-translation = "real_time_translation.main:main"
real-time-translation-demo = "real_time_translation.gradio_demo:main"
real-time-translation-exp-youtube = "real_time_translation.experiments.youtube_segment:main"
real-time-translation-exp-video = "real_time_translation.experiments.video_segment:main"
real-time-translation-render-captions = "real_time_translation.experiments.render_honest_captions:main"
real-time-translation-preload-doc = "real_time_translation.preload.document_preload:main"
real-time-translation-preload-video = "real_time_translation.preload.video_preload:main"
real-time-translation-exp-find-hardest = "real_time_translation.experiments.find_hardest_segment:main"
real-time-translation-exp-compare-dictionary = "real_time_translation.experiments.compare_dictionary_runs:main"
real-time-translation-exp-compare-models = "real_time_translation.experiments.compare_translation_models:main"
real-time-translation-exp-flicker = "real_time_translation.experiments.flicker_metrics:main"
real-time-translation-exp-cla-latency = "real_time_translation.experiments.asr_latency_cla:main"
real-time-translation-exp-utterance-end-mix = "real_time_translation.experiments.utterance_end_mix:main"
real-time-translation-exp-endpointing-boundary-audit = "real_time_translation.experiments.endpointing_boundary_audit:main"
real-time-translation-caption-video-demo = "real_time_translation.experiments.caption_video_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/real_time_translation"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
