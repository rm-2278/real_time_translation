<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live Caption Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Yu Gothic UI", "Segoe UI", "Hiragino Sans", Arial, sans-serif;
  }

  #stage {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 4vw 3vh 4vw;
    box-sizing: border-box;
  }

  #source-line {
    font-size: clamp(14px, 1.6vw, 24px);
    color: rgba(255, 255, 255, 0.72);
    background: rgba(0, 0, 0, 0.35);
    padding: 0.2em 0.6em;
    border-radius: 6px;
    margin-bottom: 0.4em;
    max-width: 90vw;
    text-align: center;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    opacity: 0;
    transition: opacity 0.25s ease;
    white-space: pre-wrap;
    /* Break between words/characters only: "word-break: break-word"
       allowed splitting inside a Latin word ("Gemm|a"). line-break:
       strict applies Japanese kinsoku (no line starting with 、。). */
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
  }
  #source-line.visible { opacity: 1; }

  #translation-line {
    font-size: clamp(22px, 3.1vw, 46px);
    font-weight: 700;
    color: #ffffff;
    background: rgba(0, 0, 0, 0.55);
    padding: 0.25em 0.7em;
    border-radius: 10px;
    max-width: 90vw;
    text-align: center;
    line-height: 1.35;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: pre-wrap;
    /* Break between words/characters only: "word-break: break-word"
       allowed splitting inside a Latin word ("Gemm|a"). line-break:
       strict applies Japanese kinsoku (no line starting with 、。). */
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
  }
  #translation-line.visible {
    opacity: 1;
    transform: translateY(0);
  }
  /* Newly streamed-in tail gets a brief highlight so growth reads as
     motion rather than a jump cut, without literally animating each
     character (we only know what text arrived, not sub-token timing). */
  #translation-line .tail {
    animation: fade-in-tail 0.35s ease;
  }
  @keyframes fade-in-tail {
    from { opacity: 0.2; }
    to { opacity: 1; }
  }

  #status {
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
    background: rgba(0, 0, 0, 0.4);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: monospace;
  }
  /* Hide the connection-status chip once we've confirmed a connection;
     re-shown automatically on disconnect. Toggle with the `debug` query
     param (?debug=1) to keep it visible for troubleshooting. */
  #status.connected:not(.debug) { display: none; }
</style>
</head>
<body>
  <div id="status">connecting…</div>
  <div id="stage">
    <div id="source-line"></div>
    <div id="translation-line"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const debug = params.get("debug") === "1";
  const showSource = params.get("source") !== "0";

  const statusEl = document.getElementById("status");
  const sourceEl = document.getElementById("source-line");
  const translationEl = document.getElementById("translation-line");
  if (debug) statusEl.classList.add("debug");
  if (!showSource) sourceEl.style.display = "none";

  let hideTimer = null;
  const HOLD_MS = 4000; // how long a finished card stays up before fading

  // Cards arrive already paced and line-wrapped by the server
  // (captions/live_presenter.py): each one replaces the previous and
  // stays up for its reading time plus HOLD_MS unless the next replaces it.
  function renderTranslation(text, { holdMs }) {
    if (!text) {
      translationEl.classList.remove("visible");
      return;
    }
    translationEl.textContent = text;
    translationEl.classList.add("visible");

    clearTimeout(hideTimer);
    if (holdMs !== null) {
      hideTimer = setTimeout(() => {
        translationEl.classList.remove("visible");
      }, holdMs);
    }
  }

  function renderSource(text) {
    if (!showSource) return;
    if (!text) {
      sourceEl.classList.remove("visible");
      return;
    }
    sourceEl.textContent = text;
    sourceEl.classList.add("visible");
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${proto}//${location.host}/ws/overlay`);

    ws.onopen = () => {
      statusEl.textContent = "connected";
      statusEl.classList.add("connected");
    };
    ws.onclose = () => {
      statusEl.textContent = "disconnected — retrying…";
      statusEl.classList.remove("connected");
      setTimeout(connect, 1500);
    };
    ws.onerror = () => ws.close();

    ws.onmessage = (event) => {
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch {
        return;
      }

      if (msg.original_text) renderSource(msg.original_text);
      if (msg.kind === "card") {
        renderTranslation(msg.translated_text, {
          holdMs: (msg.duration_ms || 0) + HOLD_MS,
        });
      } else if (msg.kind === "partial") {
        // Still-streaming translation, only sent while no card is queued.
        renderTranslation(msg.translated_text, { holdMs: null });
      }
    };
  }

  connect();
</script>
</body>
</html>
